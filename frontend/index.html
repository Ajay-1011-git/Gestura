<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gestura — Stage 1</title>
    <style>
      html,body{margin:0;height:100%;background:#16161e;color:#c0caf5;
        font:13px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
      #app{display:flex;height:100vh}
      #stage{flex:1 1 auto;position:relative;display:flex;flex-direction:column;min-width:0}
      #canvas-wrap{flex:1 1 auto;position:relative;overflow:hidden}
      canvas{display:block;width:100%;height:100%}
      #hud{position:absolute;top:12px;left:14px;line-height:1.6;text-shadow:0 1px 3px #000}
      #hud b{color:#7aa2f7;font-weight:600}
      #controls{flex:0 0 auto;padding:10px 14px;border-top:1px solid #2a2e3f;
        display:flex;align-items:center;gap:12px;background:#1a1b26}
      button{background:#292e42;color:#c0caf5;border:1px solid #3b4261;border-radius:4px;
        padding:6px 14px;font:600 12px ui-monospace,monospace;cursor:pointer}
      button:hover{background:#3b4261}
      #panel{flex:0 0 480px;max-width:45vw}
      #scrub{flex:1 1 auto;accent-color:#7aa2f7}
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="canvas-wrap"><div id="hud">loading…</div></div>
        <div id="controls">
          <button id="play">▶ PLAY</button>
          <input id="scrub" type="range" min="0" max="0" value="0" />
          <span id="frameLabel" style="opacity:.6;min-width:260px"></span>
          <label style="opacity:.6">speed</label>
          <input id="speed" type="range" min="25" max="150" value="100" style="width:110px;accent-color:#9ece6a" />
          <span id="speedLabel" style="opacity:.6;min-width:44px"></span>
        </div>
      </div>
      <div id="panel"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
